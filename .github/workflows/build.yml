name: Build XiaoZhi 2.2.3 for VIEWE SmartRing Plus (custom OTA server)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OTA_URL_TARGET: "http://8.140.207.63:8003/xiaozhi/ota/"
  TARGET_DIR: src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2

jobs:
  build:
    name: Build viewe-smartring-plus
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Ensure git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi
          git --version

      - name: Fetch vendor Xiaozhi source (sparse, only this board's project)
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/VIEWESMART/SmartRing-Plus.git src
          cd src
          git sparse-checkout set \
            examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          # NOTE: we are already inside src/, so the path must NOT repeat the
          # src/ prefix that TARGET_DIR carries.
          test -f examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/scripts/release.py \
            || { echo "ERROR: release.py missing after sparse checkout"; ls -la examples 2>/dev/null; exit 1; }
          echo "sparse checkout OK"

      - name: Point firmware at the custom OTA server
        shell: bash
        run: |
          set -e
          cd "$TARGET_DIR"
          python3 - <<'PY'
          import json
          import os
          import sys

          url = os.environ.get("OTA_URL_TARGET", "")
          # Fail loudly on the classic mistakes before spending build minutes.
          if not url.startswith("http://"):
              sys.exit("OTA URL must be plain http (server has no certificate): %r" % url)
          if "8002" in url:
              sys.exit("Port 8002 is the full-module build; this server uses 8003")
          if not url.endswith("/xiaozhi/ota/"):
              sys.exit("OTA URL must end with /xiaozhi/ota/ or the server returns 404: %r" % url)

          path = "main/boards/viewe-smartring-plus/config.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          for build in data["builds"]:
              append = build.setdefault("sdkconfig_append", [])
              append[:] = [x for x in append if not x.startswith("CONFIG_OTA_URL=")]
              append.append('CONFIG_OTA_URL="%s"' % url)

          with open(path, "w", encoding="utf-8") as f:
              f.write(json.dumps(data, ensure_ascii=False))
          print("injected:", url)
          print(open(path, encoding="utf-8").read())
          PY
          grep -q 'CONFIG_OTA_URL="http://8.140.207.63:8003/xiaozhi/ota/"' \
            main/boards/viewe-smartring-plus/config.json
          echo "config.json verified"

      - name: Build firmware
        shell: bash
        working-directory: src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/release.py viewe-smartring-plus
          test -s build/merged-binary.bin

      - name: Verify the OTA URL reached the binary
        shell: bash
        run: |
          cd "$TARGET_DIR"
          echo "BIN_SIZE=$(stat -c%s build/merged-binary.bin)"
          echo "OTA_URL_HITS=$(grep -ac '8.140.207.63:8003' build/merged-binary.bin || true)"
          echo "ASSETS_AT_800000=$(grep -ac 'CONFIG_OTA_URL' main/boards/viewe-smartring-plus/config.json || true)"
          python3 - <<'PY'
          import struct
          d = open("build/merged-binary.bin", "rb").read()
          print("magic=0x%02X size=%d" % (d[0], len(d)))
          for i in range(0, 0x1000, 0x20):
              e = d[0x8000 + i: 0x8000 + i + 32]
              if len(e) < 32 or e[:2] != b"\xaa\x50":
                  break
              _, _, _, off, size = struct.unpack("<HBBII", e[:12])
              label = e[12:28].split(b"\x00")[0].decode("ascii", "replace")
              print("  %-10s off=0x%07X size=0x%07X end=0x%07X" % (label, off, size, off + size))
          ad = d[0x20020:]
          print("app project=%s version=%s date=%s" % (
              ad[48:80].split(b"\x00")[0].decode("ascii", "replace"),
              ad[16:48].split(b"\x00")[0].decode("ascii", "replace"),
              ad[96:128].split(b"\x00")[0].decode("ascii", "replace")))
          PY
          test "$(grep -ac '8.140.207.63:8003' build/merged-binary.bin || true)" != "0" \
            || { echo "ERROR: OTA URL not found in merged binary"; exit 1; }

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-viewe-ota-custom
          path: |
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/build/merged-binary.bin
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/releases/*.zip
          if-no-files-found: error
          retention-days: 14
