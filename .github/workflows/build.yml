name: Build XiaoZhi 2.2.3 for VIEWE SmartRing Plus (1.85 IPS / 16MB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build viewe-smartring-plus
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Ensure git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi
          git --version

      - name: Fetch vendor Xiaozhi source (sparse, only this board's project)
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/VIEWESMART/SmartRing-Plus.git src
          cd src
          git sparse-checkout set \
            examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          test -f examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/scripts/release.py

      - name: Apply local overlay (clock + weather widget)
        shell: bash
        run: |
          set -e
          TARGET=src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          # Container jobs do not auto-checkout the repository, so fetch the
          # overlay from the (public) build repo explicitly. No token needed.
          git clone --depth 1 https://github.com/${{ github.repository }}.git build-meta
          test -d build-meta/overlay
          find build-meta/overlay -type f | sort
          cp -av build-meta/overlay/main/display/. "$TARGET/main/display/"
          grep -c "StartClockAndWeather" "$TARGET/main/display/lcd_display.cc"
          # main/CMakeLists.txt does not list esp_http_client (nothing upstream used
          # it), so register the dependency for the weather fetcher. Idempotent.
          cd "$TARGET"
          python3 - <<'PY'
          import re
          p = "main/CMakeLists.txt"
          src = open(p, encoding="utf-8").read()
          if "esp_http_client" in src:
              print("esp_http_client already present")
          else:
              m = re.search(r"^(\s*)PRIV_REQUIRES\s*$", src, re.M)
              if not m:
                  raise SystemExit("PRIV_REQUIRES block not found")
              indent = m.group(1) + "    "
              new = src[:m.end()] + "\n" + indent + "esp_http_client" + src[m.end():]
              open(p, "w", encoding="utf-8").write(new)
              print("injected esp_http_client into PRIV_REQUIRES")
          PY
          grep -n -A 2 "PRIV_REQUIRES" main/CMakeLists.txt | head -5
          # The app is 0x3f0d20 bytes and the stock ota_0 slot is 0x3f0000 — it no
          # longer fits. assets only needs ~2.7 MB of its 8 MB, so shrink it to 7 MB
          # and give both OTA slots 0x470000 each. Nothing hard-codes the address;
          # assets are located by partition label at runtime. Idempotent.
          python3 - <<'PY'
          p = "partitions/v2/16m.csv"
          src = open(p, encoding="utf-8").read()
          if "0x470000" in src:
              print("partition table already patched")
          else:
              out = []
              for line in src.splitlines():
                  if line.startswith("ota_0,"):
                      out.append("ota_0,    app,  ota_0,   0x20000,   0x470000,")
                  elif line.startswith("ota_1,"):
                      out.append("ota_1,    app,  ota_1,   ,          0x470000,")
                  elif line.startswith("assets,"):
                      out.append("assets,   data, spiffs,  0x900000,  7M")
                  else:
                      out.append(line)
              open(p, "w", encoding="utf-8").write("\n".join(out) + "\n")
              print("patched partition table: ota 0x470000 x2, assets 7M @ 0x900000")
          PY
          cat partitions/v2/16m.csv

      - name: Build firmware
        shell: bash
        working-directory: src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/release.py viewe-smartring-plus
          test -s build/merged-binary.bin

      - name: Verify widget code reached the binary
        shell: bash
        run: |
          cd src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          echo "SOURCE_MD5=$(md5sum main/display/lcd_display.cc | cut -d' ' -f1)"
          echo "SOURCE_WX=$(grep -c wx_widget main/display/lcd_display.cc || true)"
          OBJ=$(find build -name 'lcd_display.cc.obj' | head -1)
          echo "OBJ_PATH=$OBJ"
          if [ -n "$OBJ" ]; then
            echo "OBJ_MD5=$(md5sum "$OBJ" | cut -d' ' -f1)"
            echo "OBJ_WX=$(strings "$OBJ" | grep -c wx_widget || true)"
            echo "OBJ_WEATHER=$(strings "$OBJ" | grep -c 'ip-api' || true)"
          fi
          echo "BIN_WX=$(grep -ac wx_widget build/merged-binary.bin || true)"
          echo "BIN_WEATHER=$(grep -ac 'ip-api' build/merged-binary.bin || true)"
          echo "BIN_SIZE=$(stat -c%s build/merged-binary.bin)"
          echo "APP_BIN_WX=$(grep -ac wx_widget build/xiaozhi.bin 2>/dev/null || echo 'no app bin')"
          ls -la releases 2>/dev/null || echo "no releases dir"

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-viewe-smartring-plus-clock-weather
          path: |
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/build/merged-binary.bin
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/releases/*.zip
          if-no-files-found: error
          retention-days: 14
