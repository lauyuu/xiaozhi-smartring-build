name: Build XiaoZhi 2.2.3 for VIEWE SmartRing Plus (1.85 IPS / 16MB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build viewe-smartring-plus
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Ensure git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi
          git --version

      - name: Fetch vendor Xiaozhi source (sparse, only this board's project)
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/VIEWESMART/SmartRing-Plus.git src
          cd src
          git sparse-checkout set \
            examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          test -f examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/scripts/release.py

      - name: Apply local overlay (clock + weather widget)
        shell: bash
        run: |
          set -e
          TARGET=src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
          test -d overlay
          find overlay -type f | sort
          cp -av overlay/main/display/. "$TARGET/main/display/"
          grep -c "StartClockAndWeather" "$TARGET/main/display/lcd_display.cc"

      - name: Build firmware
        shell: bash
        working-directory: src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/release.py viewe-smartring-plus
          test -s build/merged-binary.bin

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-viewe-smartring-plus-clock-weather
          path: |
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/build/merged-binary.bin
            src/examples/esp-idf/11_xiaozhi/xiaozhi-esp32-main_smartring_plus_B_V2/releases/*.zip
          if-no-files-found: error
          retention-days: 14
